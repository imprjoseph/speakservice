<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接待團隊後台 · 講師接待系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#1B2A4A; --ink-soft:#2E3F63; --gold:#C9A227; --gold-soft:#E4C766;
    --crimson:#8B2635; --ivory:#FAF7F0; --paper:#FFFFFF; --line:#E4DFD3;
    --text:#2B2B28; --text-dim:#6B6558; --green:#2F7D4F; --red:#C24B42; --amber:#B8862B;
    --radius:14px; --shadow:0 8px 30px rgba(27,42,74,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;}
  body{background:var(--ivory);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;line-height:1.6;}

  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg, var(--ink) 0%, var(--ink-soft) 55%, var(--crimson) 130%);padding:20px;}
  .login-card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 30px;width:100%;max-width:380px;}
  .login-logo{display:block;height:20px;margin:0 auto 14px;opacity:0.85;}
  .login-eyebrow{color:var(--gold);font-size:12px;letter-spacing:0.24em;text-transform:uppercase;text-align:center;margin:0 0 8px;}
  .login-title{font-family:'Noto Serif TC',serif;font-size:21px;font-weight:900;text-align:center;color:var(--ink);margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none;}
  .field input:focus{border-color:var(--gold);}
  .btn-primary{width:100%;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-primary:disabled{opacity:0.6;}
  .login-error{font-size:13px;color:var(--red);background:#FBEAE9;padding:10px 12px;border-radius:8px;margin-top:14px;display:none;}
  .login-error.show{display:block;}

  #mainScreen{display:none;}
  #mainScreen.show{display:block;}
  .topbar{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
  .topbar-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;}
  .topbar-user{font-size:12px;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:10px;}
  .logout-btn{background:none;border:1px solid rgba(255,255,255,0.35);color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;}

  .tabbar{display:flex;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .tabbar-item{flex:1;text-align:center;padding:13px 4px;font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;border-bottom:3px solid transparent;}
  .tabbar-item.active{color:var(--ink);border-bottom-color:var(--gold);}

  .panel{display:none;padding:18px 16px 40px;max-width:560px;margin:0 auto;}
  .panel.active{display:block;}
  .card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}

  .card h3.section-title{font-family:'Noto Serif TC',serif;font-size:14px;margin:0 0 12px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .card h3.section-title::before{content:"";width:4px;height:14px;background:var(--gold);border-radius:2px;display:inline-block;}

  .req-item{padding:12px 0;border-bottom:1px solid var(--line);}
  .req-item:last-child{border-bottom:none;}
  .req-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .req-speaker{font-weight:700;font-size:13px;color:var(--ink);}
  .req-time{font-size:11px;color:var(--text-dim);}
  .req-type{display:inline-block;font-size:11px;background:var(--gold-soft);color:var(--ink);padding:2px 8px;border-radius:10px;margin-bottom:6px;}
  .req-content{font-size:13px;margin-bottom:8px;}
  .req-status-select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;margin-right:6px;}
  .req-reply-input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:12px;margin-top:6px;margin-bottom:6px;}
  .req-save-btn{background:var(--ink);color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
  .status-tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
  .status-待處理{background:#FBEAE9;color:#9A3B34;}
  .status-已處理{background:#EAF6EE;color:var(--green);}
  .status-處理中{background:#FDF6E6;color:var(--amber);}

  .spk-item{padding:12px 0;border-bottom:1px solid var(--line);}
  .spk-item:last-child{border-bottom:none;}
  .spk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .spk-name{font-weight:700;font-size:13px;color:var(--ink);}
  .spk-code{font-size:11px;color:var(--text-dim);}
  .spk-topic{font-size:12px;color:var(--text-dim);margin-bottom:8px;}
  .spk-controls{display:flex;gap:6px;align-items:center;}
  .spk-controls select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;}
  .spk-save-btn{background:var(--ink);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
  .spk-edit-btn{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}

  .edit-form{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .edit-form.show{display:block;}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .edit-field{display:flex;flex-direction:column;gap:3px;}
  .edit-field.full{grid-column:1 / -1;}
  .edit-field label{font-size:11px;color:var(--text-dim);}
  .edit-field input{padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:'Noto Sans TC',sans-serif;}
  .edit-save-row{display:flex;gap:8px;margin-top:8px;}
  .edit-save-row button{flex:1;padding:9px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;}
  .edit-save-btn{background:var(--green);color:#fff;}
  .edit-cancel-btn{background:var(--line);color:var(--text-dim);}
  .edit-save-msg{font-size:11px;color:var(--green);margin-top:6px;display:none;}
  .edit-save-msg.show{display:block;}

  .ann-form textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;min-height:70px;font-family:'Noto Sans TC',sans-serif;margin-bottom:10px;resize:vertical;}
  .ann-form label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:4px;}
  .ann-submit-msg{display:none;background:#EAF6EE;color:var(--green);padding:8px 10px;border-radius:8px;font-size:12px;margin-top:8px;}
  .ann-submit-msg.show{display:block;}

  .link-item{padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;}
  .link-item:last-child{border-bottom:none;}
  .link-qr{flex:0 0 90px;width:90px;height:90px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .link-info{flex:1;min-width:0;}
  .link-name{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:2px;}
  .link-code{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .link-url-row{display:flex;gap:6px;}
  .link-url-input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--text-dim);background:#F7F5EF;}
  .link-copy-btn{background:var(--ink);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}

  .loading{text-align:center;padding:16px;color:var(--text-dim);font-size:13px;}
  footer{text-align:center;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  footer img{height:18px;opacity:0.7;}
  footer .credit-label{font-size:11px;color:var(--text-dim);}
</style>
</head>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz3SRYSqNwSJuwMPDLiw1qS32xT32oC3ZkOulmXAvalCyQ8tO65Gngz3ER9sEvm45ZB/exec';

/* 講師前台網址：請改成你實際部署 speaker-index.html 的 GitHub Pages 網址 */
const SPEAKER_SITE_URL = 'https://imprjoseph.github.io/speakservice/';

let sessionToken = sessionStorage.getItem('speaker_sys_token') || null;
let staffName = sessionStorage.getItem('speaker_sys_name') || '';

const el = id => document.getElementById(id);

el('loginBtn').addEventListener('click', doLogin);
el('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const email = el('loginEmail').value.trim();
  const password = el('loginPassword').value;
  if(!email || !password){ showLoginError('請輸入 Email 與密碼'); return; }
  el('loginBtn').disabled = true;
  el('loginBtn').textContent = '登入中…';
  try{
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'login', email, password }) });
    const json = await res.json();
    if(!json.success){ showLoginError(json.message || '登入失敗'); return; }
    sessionToken = json.data.token;
    staffName = json.data.name;
    sessionStorage.setItem('speaker_sys_token', sessionToken);
    sessionStorage.setItem('speaker_sys_name', staffName);
    enterMainScreen();
  } catch(err){ showLoginError('連線失敗，請稍後再試'); }
  finally { el('loginBtn').disabled = false; el('loginBtn').textContent = '登入'; }
}

function showLoginError(msg){ el('loginError').textContent = msg; el('loginError').classList.add('show'); }

el('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('speaker_sys_token');
  sessionStorage.removeItem('speaker_sys_name');
  location.reload();
});

function enterMainScreen(){
  el('loginScreen').style.display = 'none';
  el('mainScreen').classList.add('show');
  el('staffNameLabel').textContent = staffName;
  loadRequests();
}

document.querySelectorAll('.tabbar-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tabbar-item').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    el(tab.dataset.panel).classList.add('active');
    if(tab.dataset.panel === 'presPanel') loadSpeakers();
    if(tab.dataset.panel === 'linkPanel') loadSpeakerLinks();
  });
});

// ---------- 需求管理 ----------
async function loadRequests(){
  el('reqList').innerHTML = '<div class="loading">載入中…</div>';
  try{
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'getRequests', token: sessionToken }) });
    const json = await res.json();
    if(!json.success){ el('reqList').innerHTML = `<div class="loading">${json.message}</div>`; return; }
    renderRequests(json.data);
  } catch(err){ el('reqList').innerHTML = '<div class="loading">載入失敗</div>'; }
}

function renderRequests(list){
  if(list.length === 0){ el('reqList').innerHTML = '<div class="loading">目前沒有需求紀錄</div>'; return; }
  el('reqList').innerHTML = list.map((r, idx) => `
    <div class="req-item">
      <div class="req-head">
        <span class="req-speaker">${r.SpeakerCode}</span>
        <span class="req-time">${formatTime(r.Timestamp)}</span>
      </div>
      <span class="req-type">${r.RequestType}</span>
      <span class="status-tag status-${r.Status}" style="margin-left:6px;">${r.Status}</span>
      <p class="req-content">${r.Content}</p>
      <input class="req-reply-input" placeholder="回覆內容…" value="${r.StaffReply || ''}" data-idx="${idx}">
      <div>
        <select class="req-status-select" data-idx="${idx}">
          <option value="待處理" ${r.Status==='待處理'?'selected':''}>待處理</option>
          <option value="處理中" ${r.Status==='處理中'?'selected':''}>處理中</option>
          <option value="已處理" ${r.Status==='已處理'?'selected':''}>已處理</option>
        </select>
        <button class="req-save-btn" data-idx="${idx}" data-timestamp="${r.Timestamp}" data-speakercode="${r.SpeakerCode}">儲存</button>
      </div>
    </div>
  `).join('');

  el('reqList').querySelectorAll('.req-save-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = btn.dataset.idx;
      const status = el('reqList').querySelector(`.req-status-select[data-idx="${idx}"]`).value;
      const reply = el('reqList').querySelector(`.req-reply-input[data-idx="${idx}"]`).value;
      btn.disabled = true;
      btn.textContent = '儲存中…';
      try{
        const res = await fetch(API_URL, {
          method:'POST',
          body: JSON.stringify({
            action:'replyRequest', token: sessionToken,
            timestamp: btn.dataset.timestamp, speakerCode: btn.dataset.speakercode,
            status, reply
          })
        });
        const json = await res.json();
        btn.textContent = json.success ? '已儲存' : '失敗';
      } catch(err){ btn.textContent = '失敗'; }
      finally { setTimeout(() => { btn.disabled = false; btn.textContent = '儲存'; }, 1500); }
    });
  });
}

// ---------- 簡報進度 ----------
async function loadSpeakers(){
  el('spkList').innerHTML = '<div class="loading">載入中…</div>';
  try{
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'getAllSpeakers', token: sessionToken }) });
    const json = await res.json();
    if(!json.success){ el('spkList').innerHTML = `<div class="loading">${json.message}</div>`; return; }
    renderSpeakers(json.data);
  } catch(err){ el('spkList').innerHTML = '<div class="loading">載入失敗</div>'; }
}

function renderSpeakers(list){
  if(list.length === 0){ el('spkList').innerHTML = '<div class="loading">尚無講師資料</div>'; return; }

  const EDIT_FIELDS = [
    ['Name','姓名'], ['NameEN','姓名(英)'], ['Title','職稱'], ['Organization','單位'],
    ['ArrivalFlight','抵達航班'], ['ArrivalTime','抵達時間'], ['ArrivalAirport','抵達機場'],
    ['PickupDriver','接機司機'], ['PickupCarPlate','車牌'], ['PickupContact','司機電話'],
    ['DepartureFlight','離境航班'], ['DepartureTime','離境時間'],
    ['HotelName','飯店名稱'], ['HotelNameEN','飯店名稱(英)'], ['HotelAddress','飯店地址'],
    ['RoomType','房型'], ['CheckInDate','入住日期'], ['CheckOutDate','退房日期'],
    ['BanquetTable','晚宴桌次'], ['BanquetSeat','晚宴座位'],
    ['PresentationTitle','講題'], ['PresentationDeadline','簡報截止日'],
    ['CVDeadline','CV截止日'], ['CVStatus','CV狀態'],
    ['PhotoDeadline','照片截止日'], ['PhotoStatus','照片狀態'],
    ['PassportDeadline','護照截止日'], ['PassportStatus','護照狀態'],
    ['FlightDeadline','航班資訊截止日'], ['FlightStatus','航班資訊狀態'],
    ['EmergencyContactName','緊急聯絡人'], ['EmergencyContactPhone','聯絡電話'], ['EmergencyContactRelation','關係'], ['EmergencyContactWhatsApp','WhatsApp'],
  ];

  el('spkList').innerHTML = list.map((s, idx) => `
    <div class="spk-item">
      <div class="spk-head">
        <span class="spk-name">${s.Name}</span>
        <span class="spk-code">${s.SpeakerCode}</span>
      </div>
      <div class="spk-topic">${s.PresentationTitle || '（尚未提供講題）'}　·　截止：${s.PresentationDeadline || '—'}</div>
      <div class="spk-controls">
        <select data-code="${s.SpeakerCode}">
          <option value="未繳交" ${s.PresentationStatus==='未繳交'?'selected':''}>未繳交</option>
          <option value="已收到" ${s.PresentationStatus==='已收到'?'selected':''}>已收到</option>
          <option value="需修改" ${s.PresentationStatus==='需修改'?'selected':''}>需修改</option>
          <option value="確認完稿" ${s.PresentationStatus==='確認完稿'?'selected':''}>確認完稿</option>
        </select>
        <button class="spk-save-btn" data-code="${s.SpeakerCode}">更新狀態</button>
        <button class="spk-edit-btn" data-idx="${idx}">編輯資料</button>
      </div>
      <div class="edit-form" id="edit-${idx}">
        <div class="edit-grid">
          ${EDIT_FIELDS.map(([key,label]) => `
            <div class="edit-field${key==='HotelAddress'?' full':''}">
              <label>${label}</label>
              <input data-key="${key}" value="${(s[key] || '').toString().replace(/"/g,'&quot;')}">
            </div>
          `).join('')}
        </div>
        <div class="edit-save-row">
          <button class="edit-save-btn" data-code="${s.SpeakerCode}" data-idx="${idx}">儲存變更</button>
          <button class="edit-cancel-btn" data-idx="${idx}">取消</button>
        </div>
        <div class="edit-save-msg" id="edit-msg-${idx}">已儲存</div>
      </div>
    </div>
  `).join('');

  el('spkList').querySelectorAll('.spk-save-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const code = btn.dataset.code;
      const status = el('spkList').querySelector(`select[data-code="${code}"]`).value;
      btn.disabled = true;
      btn.textContent = '更新中…';
      try{
        const res = await fetch(API_URL, {
          method:'POST',
          body: JSON.stringify({ action:'updatePresentationStatus', token: sessionToken, speakerCode: code, status })
        });
        const json = await res.json();
        btn.textContent = json.success ? '已更新' : '失敗';
      } catch(err){ btn.textContent = '失敗'; }
      finally { setTimeout(() => { btn.disabled = false; btn.textContent = '更新狀態'; }, 1500); }
    });
  });

  el('spkList').querySelectorAll('.spk-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      el(`edit-${btn.dataset.idx}`).classList.toggle('show');
    });
  });

  el('spkList').querySelectorAll('.edit-cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      el(`edit-${btn.dataset.idx}`).classList.remove('show');
    });
  });

  el('spkList').querySelectorAll('.edit-save-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = btn.dataset.idx;
      const form = el(`edit-${idx}`);
      const fields = {};
      form.querySelectorAll('input[data-key]').forEach(input => {
        fields[input.dataset.key] = input.value;
      });
      btn.disabled = true;
      btn.textContent = '儲存中…';
      try{
        const res = await fetch(API_URL, {
          method:'POST',
          body: JSON.stringify({ action:'updateSpeaker', token: sessionToken, speakerCode: btn.dataset.code, fields })
        });
        const json = await res.json();
        const msg = el(`edit-msg-${idx}`);
        msg.textContent = json.success ? '已儲存變更' : (json.message || '儲存失敗');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 3000);
      } catch(err){
        const msg = el(`edit-msg-${idx}`);
        msg.textContent = '儲存失敗，請稍後再試';
        msg.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = '儲存變更';
      }
    });
  });
}

// ---------- 講師連結 / QR Code ----------
async function loadSpeakerLinks(){
  el('linkList').innerHTML = '<div class="loading">載入中…</div>';
  try{
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'getAllSpeakers', token: sessionToken }) });
    const json = await res.json();
    if(!json.success){ el('linkList').innerHTML = `<div class="loading">${json.message}</div>`; return; }
    renderSpeakerLinks(json.data);
  } catch(err){ el('linkList').innerHTML = '<div class="loading">載入失敗</div>'; }
}

function renderSpeakerLinks(list){
  if(list.length === 0){ el('linkList').innerHTML = '<div class="loading">尚無講師資料</div>'; return; }

  el('linkList').innerHTML = list.map((s, idx) => `
    <div class="link-item">
      <div class="link-qr" id="qr-${idx}"></div>
      <div class="link-info">
        <div class="link-name">${s.Name}</div>
        <div class="link-code">${s.SpeakerCode}</div>
        <div class="link-url-row">
          <input class="link-url-input" readonly value="${SPEAKER_SITE_URL}?code=${encodeURIComponent(s.SpeakerCode)}" id="url-${idx}">
          <button class="link-copy-btn" data-idx="${idx}">複製</button>
        </div>
      </div>
    </div>
  `).join('');

  list.forEach((s, idx) => {
    const url = `${SPEAKER_SITE_URL}?code=${encodeURIComponent(s.SpeakerCode)}`;
    new QRCode(el(`qr-${idx}`), { text: url, width: 80, height: 80, colorDark: '#1B2A4A', colorLight: '#ffffff' });
  });

  el('linkList').querySelectorAll('.link-copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = el(`url-${btn.dataset.idx}`);
      input.select();
      navigator.clipboard.writeText(input.value).then(() => {
        btn.textContent = '已複製';
        setTimeout(() => { btn.textContent = '複製'; }, 1500);
      });
    });
  });
}

// ---------- 發布公告 ----------
el('annSubmitBtn').addEventListener('click', async () => {
  const content = el('annContentCN').value.trim();
  const contentEN = el('annContentEN').value.trim();
  if(!content){ return; }
  el('annSubmitBtn').disabled = true;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({ action:'publishAnnouncement', token: sessionToken, content, contentEN })
    });
    const json = await res.json();
    if(json.success){
      el('annSuccess').classList.add('show');
      el('annContentCN').value = '';
      el('annContentEN').value = '';
      setTimeout(() => el('annSuccess').classList.remove('show'), 3000);
    }
  } catch(err){ console.error(err); }
  finally { el('annSubmitBtn').disabled = false; }
});

function formatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  if(isNaN(d)) return ts;
  return d.toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}

if(sessionToken){ enterMainScreen(); }
